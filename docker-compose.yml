services:
  hitron-exporter:
    build: .
    container_name: hitron-exporter
    restart: unless-stopped
    ports:
      - "9705:9705"          # Prometheus scrape target
    environment:
      - TZ=America/Chicago
      - MODEM_URL=https://192.168.100.1
      - MIN_POLL_INTERVAL=300  # never poll the modem faster than this (seconds)
      # - LISTEN_PORT=9705
      # - REQUEST_TIMEOUT=10
    volumes:
      - /etc/localtime:/etc/localtime:ro
